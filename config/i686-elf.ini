[constants]
toolroot = '@GLOBAL_SOURCE_ROOT@' / 'tools' / 'build' / 'bin'
compiler = toolroot / 'i686-elf-gcc'

[binaries]
c = compiler
ar = toolroot / 'i686-elf-ar'
strip = toolroot / 'i686-elf-strip'

[host_machine]
system = 'none'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = true
compiler = compiler

[built-in options]
b_pie = false
b_staticpic = false
